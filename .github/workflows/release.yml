name: Windows build and release

# Builds Beamer.exe on Windows and runs the audio tests. Pushing a tag such as v1.5.14-audio.1
# also publishes the exe as a GitHub Release.
on:
  push:
    branches: [main, audio-sharing]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: win_app/requirements-win.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-win.txt

      - name: Audio tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_audio_share tests.test_audio_integration tests.test_audio_mute -v

      - name: Build Beamer.exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build build.spec

      - name: Check every module is in the exe
        working-directory: .
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/import_probe.py win win_app/dist/Beamer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Beamer-windows
          path: win_app/dist/Beamer.exe

      - name: Name the file for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Copy-Item dist/Beamer.exe "dist/Beamer-${{ github.ref_name }}.exe"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: win_app/dist/Beamer-${{ github.ref_name }}.exe
          generate_release_notes: true
